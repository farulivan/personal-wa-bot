# Advisories OSV-Scanner reports that I've read and accepted, each with the
# reason it can't reach this bot. Every entry expires, so it gets read again.

[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
effectiveUntil = 2027-04-23
reason = "esbuild 0.18.20 comes via drizzle-kit's deprecated @esbuild-kit/esm-loader, and drizzle-kit's latest release still depends on it. The advisory needs esbuild --serve, which nothing here runs. Dismissed as Dependabot alert #1 for the same reason."

# The next two are only fixed in minimatch 11 and glob 14, with no backports.
# Both come in through Testcontainers: its archiver 7 uses archiver-utils, which
# needs glob 10, which needs minimatch 9. When they expire, check
# testcontainers/testcontainers-node#1641 for whether Testcontainers has moved
# off archiver 7. #1425 there explains why that's harder than a version bump.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
effectiveUntil = 2027-01-31
reason = "minimatch 9.0.9 is dev only, through glob 10.5.0 under Testcontainers' archiver. The advisory needs optimizationLevel 2 or higher and a pattern an attacker controls, and 9.0.9 only runs under a glob.sync that archiver never calls. ESLint and typescript-eslint are on the fixed 11.x, and the 5.1.9 that archiver's readdir-glob brings is outside the advisory's range. Delete this once pnpm-lock.yaml has no minimatch from 7.0.0 through 11.0.0."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
effectiveUntil = 2027-01-31
reason = "glob 10.5.0 is dev only, through Testcontainers' archiver. The advisory needs a caller that passes an AbortSignal. The only call is a glob.sync in archiver-utils that archiver never reaches, and nothing gives it a signal. Delete this once pnpm-lock.yaml has no glob from 9.0.0 through 14.0.1."
