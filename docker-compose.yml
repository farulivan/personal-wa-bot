services:
  wa-bot:
    build: .
    container_name: personal-wa-bot
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      # Persist the WhatsApp session. The old .wwebjs_auth mount is kept so a
      # rollback to the previous image still finds its session intact.
      - ./baileys_auth:/app/baileys_auth
      - ./.wwebjs_auth:/app/.wwebjs_auth
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://wabot:wabot@postgres:5432/wabot
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    container_name: personal-wa-bot-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=wabot
      - POSTGRES_PASSWORD=wabot
      - POSTGRES_DB=wabot
    ports:
      - "5432:5432"

volumes:
  pgdata:
