services:
  wa-bot:
    build: .
    container_name: personal-wa-bot
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      # Persist the WhatsApp session.
      - ./baileys_auth:/app/baileys_auth
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://wabot:wabot@postgres:5432/wabot
    env_file:
      - .env

  postgres:
    image: postgres:18
    container_name: personal-wa-bot-db
    restart: unless-stopped
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and its VOLUME to the
      # parent, so the named volume has to sit on the parent. Mounting the old .../data path
      # would leave the cluster in an anonymous volume that disappears on `docker compose down`.
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_USER=wabot
      - POSTGRES_PASSWORD=wabot
      - POSTGRES_DB=wabot
    ports:
      - "5432:5432"

volumes:
  pgdata:
