packages: []

# pnpm 10 runs no dependency's install scripts unless told to, and none is
# allowed. These are the packages that ship one, each read and left off:
ignoredBuiltDependencies:
  # A preinstall that exits when Node is older than 20. The image runs 24.
  - '@whiskeysockets/baileys'
  # A postinstall that warns when a dependent asks for the wrong version range.
  - protobufjs
  # Testcontainers brings these in through ssh2. Their build scripts only compile
  # optional native crypto for reaching Docker over SSH, which the tests never do.
  - cpu-features
  - ssh2
  # Checks its platform binary and downloads it if missing. pnpm already installs
  # that binary as an optional dependency.
  - esbuild

# On by default from pnpm 11. Without it, a dependency that gains an install
# script only gets a warning in the install log. With it, the install fails until
# someone reads the script and lists the package above. ChainDrop spread this way
# in August 2026: patch releases that quietly added a preinstall.
strictDepBuilds: true

# Both of these are defaults from pnpm 11 onwards; set here so pnpm 10 enforces
# them too. A version must be a day old before it resolves, since most hijacked
# releases are caught within hours, and only a direct dependency may come from
# git or a tarball URL.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Also a pnpm 11 default. Before any script runs, pnpm compares node_modules with
# the lockfile and installs first if they differ, so switching branches can't leave
# a test run on the previous branch's packages.
verifyDepsBeforeRun: install

# Baileys lists sharp as a peer for its media features, which this bot never uses:
# it only ever sends text. Auto-installing peers dragged in sharp and 19 MB of
# libvips binaries, plus better-sqlite3 from drizzle's sqlite driver. Baileys loads
# sharp as import('sharp').catch(...), so it copes with it being absent.
autoInstallPeers: false
