name: CI

on:
  push:
    branches: [main] 
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint)
        run: pnpm verify

      - name: Test
        run: pnpm test
